# よみちのコミュニティを進める。
#
# 数時間おきに住人が書き込み、返信し、たまに集まりを立てる。生成は**ここ（Actions
# の中）でしか行わない**。GitHub Pages が配るものは誰でも読めるので、鍵をブラウザ
# 側へ渡した時点で公開したことになる。
#
# 生成した結果は content/feed.json への commit として残り、そのままデプロイする。
# GITHUB_TOKEN による push では別のワークフローが起動しない仕様なので、
# デプロイは Pages のワークフローを直接呼んで行う。
name: Community

on:
  schedule:
    # 3 時間おき（UTC）。日本時間だと 0 時・3 時・6 時…に相当する
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: community
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 鍵が未設定のうちは、失敗させずに黙って何もしない
      - id: guard
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY が未設定なので何もしない"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - id: generate
        if: steps.guard.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          node apps/yomichi/scripts/generate.mjs
          if git diff --quiet -- apps/yomichi/content/feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "yomichi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/yomichi/content/feed.json
          git commit -m "よみち：$(date -u '+%Y-%m-%d %H:%M') の書き込み"
          git push

  deploy:
    needs: write
    if: needs.write.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    # 呼ばれた側は secret を受け取れないので、明示して渡す。無いと、こちらから
    # 起きたデプロイだけ関係引継の台本生成が鍵なしで束ねられて、黙って使えなくなる
    secrets: inherit
