# apps/ の下にあるものを全部ビルドして、GitHub Pages に並べる。
#
# 新しい作品を足すときは apps/<名前>/ を作るだけでよく、この定義は触らない。
# base のパスは /<リポジトリ名>/<作品名>/ になる（Pages のプロジェクトサイトの形）。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの取り違えを防ぐ。走っている途中の古いものは捨てる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every app
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          for dir in apps/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            npm --prefix "$dir" ci
            BASE_PATH="/${GITHUB_REPOSITORY#*/}/$name/" npm --prefix "$dir" run build
            mkdir -p "_site/$name"
            cp -R "$dir/dist/." "_site/$name/"
            echo "::endgroup::"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
