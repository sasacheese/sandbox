# apps/ の下にあるものを全部ビルドして、GitHub Pages に並べる。
#
# 新しい作品を足すときは apps/<名前>/ を作るだけでよく、この定義は触らない。
# base のパスは /<リポジトリ名>/<作品名>/ になる（Pages のプロジェクトサイトの形）。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 別のワークフロー（コミュニティの生成）から呼ばれる
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの取り違えを防ぐ。走っている途中の古いものは捨てる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ブランチの先端を取る。
      #
      # 既定では**起動のきっかけになった時点**の commit を取るので、
      # コミュニティの生成ワークフローから呼ばれたとき、生成した内容が
      # 入る前の状態をビルドして配ってしまう（実際に取りこぼした）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 関係引継の台本生成は、ブラウザから直接モデルを呼ぶ。鍵はビルド時に
      # 束ねる（設定画面には出さない、という本人の判断）。**配信物に入るので
      # 公開サイトから読める**——上限つきの鍵を使うこと。
      - name: Build every app
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          for dir in apps/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            npm --prefix "$dir" ci
            BASE_PATH="/${GITHUB_REPOSITORY#*/}/$name/" npm --prefix "$dir" run build
            mkdir -p "_site/$name"
            cp -R "$dir/dist/." "_site/$name/"
            echo "::endgroup::"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
