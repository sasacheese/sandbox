<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>sandbox</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0c0c0e;
        color: #dedad1;
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
      }
      main { padding: 32px; max-width: 420px; width: 100%; }
      h1 {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7e7a73;
        font-weight: 400;
        margin: 0 0 20px;
      }
      a {
        display: block;
        padding: 16px 0;
        border-top: 1px solid rgb(230 226 216 / 0.12);
        color: inherit;
        text-decoration: none;
        font-size: 19px;
      }
      a:last-of-type { border-bottom: 1px solid rgb(230 226 216 / 0.12); }
      p { color: #56534e; font-size: 12px; margin: 20px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>sandbox</h1>
      <a href="./yomichi/">よみち</a>
      <a href="./unei/">運営</a>
      <p>それぞれの入口で合言葉が要る。</p>
    </main>
  </body>
</html>
